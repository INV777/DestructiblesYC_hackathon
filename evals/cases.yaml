    - {date: "2026-10-07", description: "AWS EMEA", amount_inr: 18500}
    - {date: "2026-10-07", description: "AWS EMEA", amount_inr: 18500}
    - {date: "2026-10-09", description: "PAYTM*SHARMA TRD", amount_inr: 4000}
  expect:
