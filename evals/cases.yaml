- id: limit-reached
  category: Limits
  about: With the time limit already used, nothing is verified; every line says why.
  config: {limits: {max_time_seconds: 0}}
  lines:
    - {date: "2026-10-20", description: "USHNIK CLOUD", amount_inr: 3999}
    - {date: "2026-10-20", description: "RAZ*TARANGINI FREIGHT", amount_inr: 900}
  expect:
    - {status: CANNOT_VERIFY, says: "limit"}
    - {status: CANNOT_VERIFY, says: "limit"}

