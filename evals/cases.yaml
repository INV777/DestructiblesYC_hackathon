    - {date: "2026-10-07", description: "USHNIK CLOUD", amount_inr: 3999}
  expect:
    - {status: VERIFIED}
    - {status: VERIFIED}

- id: bank-different-amount-is-not-duplicate
  category: Duplicate bank lines
  about: Two fuel fills on the same day for different amounts are two purchases.
  lines:
    - {date: "2026-10-09", description: "POS PARVATI FUELS", amount_inr: 7200}
    - {date: "2026-10-09", description: "POS PARVATI FUELS", amount_inr: 6100}
  expect:
    - {status: VERIFIED}
    - {status: VERIFIED}

