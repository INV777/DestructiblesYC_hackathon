# SettleBot configuration. Everything a judge might change in a live fix lives here.
# Values marked TODO are filled at kickoff (client records, limits) or from price pages.

client:
  name: "TODO: client name from kickoff kit"

limits:
  max_cost_inr: 50.0        # TODO: set from kickoff kit (limits.max_cost_inr)
  max_time_seconds: 600     # TODO: set from kickoff kit (limits.max_time_seconds)

llm:
  provider: anthropic       # reads ANTHROPIC_API_KEY from .env; no key -> rules only, fail closed
  model: claude-haiku-5-5
  max_tokens: 1024
  # No temperature setting: the current Anthropic SDK does not take one. Determinism comes from
  # forced tool calls, per-run caching of every answer, and code checks on every proposal.
  # INR per million tokens for claude-haiku-5-5 (prompts up to 100K tokens):
  # USD 0.10 in / 0.50 out per MTok x RBI reference rate 93.3461 INR/USD (19 Nov 2026).
  price_inr_per_mtok:
    input: 9.33
    output: 46.67

crustdata:
  base_url: https://api.crustdata.com
  api_version: "2025-11-01"
  # Crustdata credits cost USD 0.30 down to 0.01 depending on plan (crustdata.com pricing pages).
  # Placeholder: volume tier USD 0.01 x 93.3461 = INR 0.93. REPLACE with your plan's price.
  # At USD 0.30 a line costs ~INR 33 (1.2 credits), so raise limits.max_cost_inr and the price too.
  inr_per_credit: 0.93

sources:
  # Order in which payee sources are tried. "fake" is for tests only.
  order: [crustdata_identify, crustdata_web]
  timeout_seconds: 20
  retries: 2
  backoff_seconds: 1.5

payments:
  provider: razorpay_orders # razorpay_orders | fake
  currency: INR
  receipt_prefix: "sb_"     # receipt = prefix + 32 hex chars (Razorpay max is 40)

approvals:
  # One rule per line; the first matching rule decides how many approvers an action needs.
  rules:
    - {action: PAY, min_amount_inr: 0, approvers: 1}
    - {action: RELEASE_HOLD, min_amount_inr: 0, approvers: 1}

vendor_master: data/vendor_master.json   # TODO: replace with the client's vendor master from the kit

duplicates:
  # Lines with the same date, descriptor and amount are held as possible duplicates.
  same_day_only: true

descriptor:
  # Card/UPI processor prefixes stripped before looking up the merchant.
  processor_prefixes:
    "RAZ*": Razorpay
    "PAYTM*": Paytm
    "PYU*": PayU
    "CCAV*": CCAvenue
    "BDSK*": BillDesk
    "UPI/": UPI
    "POS ": POS
  city_tokens: [BLR, BANGALORE, BENGALURU, MUM, MUMBAI, BOM, DEL, DELHI, NDL, HYD, HYDERABAD,
                CHN, CHENNAI, MAA, PUNE, PNQ, KOL, KOLKATA, CCU, GGN, GURGAON, GURUGRAM, NOIDA, IN, IND]

chart_of_accounts:
  - {code: "6110", name: "Staff meals", keywords: [swiggy, zomato, food, meals, restaurant, cafe]}
  - {code: "6420", name: "Cloud hosting", keywords: [aws, amazon web services, azure, google cloud, gcp, digitalocean, hosting]}
  - {code: "6430", name: "Software subscriptions", keywords: [saas, subscription, software, slack, notion, atlassian, github]}
  - {code: "5110", name: "Freight and carriage", keywords: [freight, transport, logistics, carrier, trucking, roadways]}
  - {code: "6210", name: "Fuel", keywords: [fuel, petrol, diesel, indianoil, bharat petroleum, hpcl]}
  - {code: "6310", name: "Travel", keywords: [uber, ola, makemytrip, indigo, airline, irctc, travel]}
  - {code: "6510", name: "Telecom and internet", keywords: [airtel, jio, vodafone, telecom, broadband]}
  - {code: "9999", name: "Suspense (needs review)", keywords: []}

finance:
  # Our price, charged only when a line is done. Benchmark must carry a source before the finals.
  price_inr_per_line: 12.0
  # Outsourced AP in India: "Simple invoice processing might cost Rs 50-80 per invoice", and
  # 150-200 with three-way matching and GST checks (Pazy, AP outsourcing guide for India).
  # We use the low end to stay conservative.
  benchmark_inr_per_line: 50
  benchmark_source_url: https://www.pazy.io/blogs/outsource-ap-guide-india

output:
  # Optional fields added by live fixes, e.g. [tds_194c_estimate]
  extra_fields: []
