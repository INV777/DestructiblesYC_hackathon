name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests (offline, recorded responses, no keys)
        run: python -m pytest -q
      - name: Kill test during verification
        run: python scripts/kill_test.py --rounds 10
      - name: Kill test during payment
        run: python scripts/kill_test.py --rounds 10 --pay
